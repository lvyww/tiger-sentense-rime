name: Lua and Rime regressions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua:
    name: Linux ${{ matrix.lua }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lua: [lua5.3, lua5.4, luajit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install interpreter
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.lua }}
      - name: Existing suite, new regressions and functional negative controls
        shell: bash
        run: |
          set -o pipefail
          python3 tools/run_regressions.py --lua ${{ matrix.lua }} --negative-control | tee regression.log
      - name: Compile and exercise the counting-allocator memory probe
        if: matrix.lua == 'lua5.4'
        run: |
          sudo apt-get install -y liblua5.4-dev pkg-config
          cc -O2 tools/lua_memory_runner.c $(pkg-config --cflags --libs lua5.4) -o "$RUNNER_TEMP/lua-memory"
          "$RUNNER_TEMP/lua-memory" tools/test_memory.lua .
      - name: Archive exact tested sources
        if: always()
        run: git archive --format=zip --output=tested-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regression-${{ matrix.lua }}
          path: |
            tested-source.zip
            regression.log
          retention-days: 7
          if-no-files-found: error

  archlinux-rolling-lua:
    name: archlinux lua (rolling)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - name: Bootstrap container
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git nodejs python lua
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run regressions with pacman's lua
        run: |
          set -euo pipefail
          lua -v
          python3 tools/run_regressions.py --lua "$(command -v lua)" --negative-control | tee regression.log
      - name: Archive exact tested sources
        if: always()
        run: git -c safe.directory="$GITHUB_WORKSPACE" archive --format=zip --output=tested-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: regression-archlinux-rolling-lua
          path: |
            tested-source.zip
            regression.log
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows Lua 5.4 ${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    env:
      PYTHONUTF8: '1'
      LUA_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile pinned official Lua and run isolated regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'lua-5.4.8.tar.gz'
          Invoke-WebRequest https://www.lua.org/ftp/lua-5.4.8.tar.gz -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae') { throw 'Lua source checksum mismatch' }
          tar -xzf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$env:LUA_ARCH -host_arch=x64"
          $src = Join-Path $env:RUNNER_TEMP 'lua-5.4.8/src'
          Push-Location $src
          try {
            $files = @(Get-ChildItem *.c | Where-Object { $_.Name -ne 'luac.c' } | ForEach-Object { $_.FullName })
            & cl /nologo /O2 /D_CRT_SECURE_NO_WARNINGS $files /Fe:lua.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          python tools/run_regressions.py --lua "$src/lua.exe" --negative-control
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  rime:
    name: Real librime processor chain
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install real Rime development library and Lua plugin
        run: sudo apt-get update && sudo apt-get install -y g++ librime-dev librime-plugin-lua
      - name: Test distribution compatibility and pinned modern preedit host
        shell: bash
        run: |
          set -o pipefail
          bash tools/run_rime_host_tests.sh 2>&1 | tee rime-host.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-rime-host
          path: rime-host.log
          retention-days: 7
          if-no-files-found: error

  equivalence:
    name: Independent old/new decoder snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Compare both sources with one independent probe
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '18adb705823b4e98e322cb4e153b2f313e4c2428' }}
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/tiger-equivalence-base"
          mkdir -p "$baseline"
          git archive "$BASE_REF" | tar -x -C "$baseline"
          python3 tools/compare_revisions.py --baseline "$baseline" --lua lua5.4 --cases 20 --report equivalence-none.json
          python3 tools/compare_revisions.py --baseline "$baseline" --lua lua5.4 --fixture --legacy-ranking --cases 20 --report equivalence-fixture.json
          python3 tools/compare_revisions.py --baseline "$baseline" --lua lua5.4 --fixture --legacy-ranking --memory-profile compact --trim-every 37 --cases 20 --report equivalence-compact.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: decoder-equivalence
          path: equivalence-*.json
          retention-days: 7
          if-no-files-found: error
